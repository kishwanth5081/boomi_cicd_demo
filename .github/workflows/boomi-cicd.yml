name: Boomi Save Trigger CI-CD

on:
  repository_dispatch:
    types:
      - boomi_component_saved

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boomi-cicd-deployment
  cancel-in-progress: false

jobs:
  package-deploy-execute:

    name: Package Deploy Execute

    runs-on: ubuntu-latest

    env:
      BOOMI_API_BASE_URL: ${{ secrets.BOOMI_API_BASE_URL }}
      BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
      BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
      BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
      BOOMI_COMPONENT_ID: ${{ secrets.BOOMI_COMPONENT_ID }}
      BOOMI_ENVIRONMENT_ID: ${{ secrets.BOOMI_ENVIRONMENT_ID }}
      BOOMI_ATOM_ID: ${{ secrets.BOOMI_ATOM_ID }}

      EXPECTED_PROCESS_NAME: CICD_Demo_Process

    steps:

      # ======================================================
      # STEP 1
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v7


      # ======================================================
      # STEP 2
      # ======================================================

      - name: Validate Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STEP 1 - VALIDATE CONFIGURATION"
          echo "=========================================="

          REQUIRED_VARIABLES=(
            BOOMI_API_BASE_URL
            BOOMI_ACCOUNT_ID
            BOOMI_USERNAME
            BOOMI_API_TOKEN
            BOOMI_COMPONENT_ID
            BOOMI_ENVIRONMENT_ID
            BOOMI_ATOM_ID
          )

          for VARIABLE_NAME in "${REQUIRED_VARIABLES[@]}"; do

            if [[ -z "${!VARIABLE_NAME:-}" ]]; then

              echo "ERROR: ${VARIABLE_NAME} is missing."

              exit 1

            fi

          done

          API_ROOT="${BOOMI_API_BASE_URL%/}/api/rest/v1/${BOOMI_ACCOUNT_ID}"

          echo "API_ROOT=${API_ROOT}" >> "${GITHUB_ENV}"

          echo ""
          echo "Process being deployed:"
          echo "${EXPECTED_PROCESS_NAME}"

          echo ""
          echo "Configuration validation successful."


      # ======================================================
      # STEP 3
      # ======================================================

      - name: Verify Saved Boomi Revision
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STEP 2 - VERIFY SAVED BOOMI REVISION"
          echo "=========================================="

          AUTH_USER="BOOMI_TOKEN.${BOOMI_USERNAME}"

          HTTP_CODE="$(
            curl -sS \
              -o component_response.json \
              -w "%{http_code}" \
              -u "${AUTH_USER}:${BOOMI_API_TOKEN}" \
              -H "Accept: application/json" \
              "${API_ROOT}/ComponentMetadata/${BOOMI_COMPONENT_ID}"
          )"

          echo "ComponentMetadata HTTP Status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" != "200" ]]; then

            echo "ERROR: Unable to retrieve Boomi component."

            cat component_response.json || true

            exit 1

          fi

          echo ""
          echo "Boomi ComponentMetadata:"
          jq . component_response.json

          COMPONENT_NAME="$(
            jq -r '.name // empty' component_response.json
          )"

          COMPONENT_TYPE="$(
            jq -r '.type // empty' component_response.json
          )"

          CURRENT_REVISION="$(
            jq -r '.version // empty' component_response.json
          )"

          MODIFIED_BY="$(
            jq -r '.modifiedBy // empty' component_response.json
          )"

          MODIFIED_DATE="$(
            jq -r '.modifiedDate // empty' component_response.json
          )"

          echo ""
          echo "=========================================="
          echo "LATEST SAVED COMPONENT"
          echo "=========================================="
          echo "Process          : ${COMPONENT_NAME}"
          echo "Component Type   : ${COMPONENT_TYPE}"
          echo "Current Revision : ${CURRENT_REVISION}"
          echo "Modified By      : ${MODIFIED_BY}"
          echo "Modified Date    : ${MODIFIED_DATE}"
          echo "=========================================="

          if [[ "${COMPONENT_NAME}" != "${EXPECTED_PROCESS_NAME}" ]]; then

            echo "ERROR: Component ID belongs to another process."

            echo "Expected: ${EXPECTED_PROCESS_NAME}"
            echo "Actual  : ${COMPONENT_NAME}"

            exit 1

          fi

          if [[ "${COMPONENT_TYPE}" != "process" ]]; then

            echo "ERROR: Component is not a process."

            exit 1

          fi

          if [[ -z "${CURRENT_REVISION}" ]]; then

            echo "ERROR: Revision was not returned by Boomi."

            exit 1

          fi

          EVENT_REVISION=""

          if [[ "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then

            EVENT_REVISION="$(
              jq -r '.client_payload.new_revision // empty' \
              "${GITHUB_EVENT_PATH}"
            )"

            echo ""
            echo "Watcher reported revision: ${EVENT_REVISION:-UNKNOWN}"
          fi

          echo "CURRENT_REVISION=${CURRENT_REVISION}" >> "${GITHUB_ENV}"

          PACKAGE_VERSION="SAVE-R${CURRENT_REVISION}-GHA-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"

          echo ""
          echo "Package Version:"
          echo "${PACKAGE_VERSION}"


      # ======================================================
      # STEP 4
      # ======================================================

      - name: Create Boomi Packaged Component
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STEP 3 - CREATE PACKAGED COMPONENT"
          echo "=========================================="

          AUTH_USER="BOOMI_TOKEN.${BOOMI_USERNAME}"

          jq -n \
            --arg componentId "${BOOMI_COMPONENT_ID}" \
            --arg packageVersion "${PACKAGE_VERSION}" \
            --arg notes "Automatically packaged after CICD_Demo_Process Save. Revision ${CURRENT_REVISION}. GitHub Run ${GITHUB_RUN_ID}." \
            '{
              componentId: $componentId,
              packageVersion: $packageVersion,
              notes: $notes
            }' > package_request.json

          echo "Package request:"
          jq . package_request.json

          HTTP_CODE="$(
            curl -sS \
              -o package_response.json \
              -w "%{http_code}" \
              -u "${AUTH_USER}:${BOOMI_API_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -X POST \
              "${API_ROOT}/PackagedComponent" \
              --data @package_request.json
          )"

          echo ""
          echo "PackagedComponent HTTP Status: ${HTTP_CODE}"

          jq . package_response.json || cat package_response.json

          if (( HTTP_CODE < 200 || HTTP_CODE >= 300 )); then

            echo "ERROR: Packaged Component creation failed."

            exit 1

          fi

          PACKAGE_ID="$(
            jq -r '.packageId // empty' package_response.json
          )"

          CREATED_PACKAGE_VERSION="$(
            jq -r '.packageVersion // empty' package_response.json
          )"

          PACKAGED_COMPONENT_REVISION="$(
            jq -r '.componentVersion // empty' package_response.json
          )"

          if [[ -z "${PACKAGE_ID}" ]]; then

            echo "ERROR: packageId was not returned."

            exit 1

          fi

          echo "PACKAGE_ID=${PACKAGE_ID}" >> "${GITHUB_ENV}"

          echo "PACKAGED_COMPONENT_REVISION=${PACKAGED_COMPONENT_REVISION}" >> "${GITHUB_ENV}"

          echo ""
          echo "=========================================="
          echo "PACKAGE CREATED"
          echo "=========================================="
          echo "Package ID         : ${PACKAGE_ID}"
          echo "Package Version    : ${CREATED_PACKAGE_VERSION}"
          echo "Component Revision : ${PACKAGED_COMPONENT_REVISION}"
          echo "=========================================="


      # ======================================================
      # STEP 5
      # ======================================================

      - name: Deploy Package to Test Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STEP 4 - DEPLOY PACKAGE TO TEST"
          echo "=========================================="

          AUTH_USER="BOOMI_TOKEN.${BOOMI_USERNAME}"

          jq -n \
            --arg environmentId "${BOOMI_ENVIRONMENT_ID}" \
            --arg packageId "${PACKAGE_ID}" \
            --arg notes "Automatically deployed after CICD_Demo_Process Save. Revision ${CURRENT_REVISION}." \
            '{
              environmentId: $environmentId,
              packageId: $packageId,
              notes: $notes
            }' > deployment_request.json

          HTTP_CODE="$(
            curl -sS \
              -o deployment_response.json \
              -w "%{http_code}" \
              -u "${AUTH_USER}:${BOOMI_API_TOKEN}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -X POST \
              "${API_ROOT}/DeployedPackage" \
              --data @deployment_request.json
          )"

          echo "DeployedPackage HTTP Status: ${HTTP_CODE}"

          jq . deployment_response.json || cat deployment_response.json

          if (( HTTP_CODE < 200 || HTTP_CODE >= 300 )); then

            echo "ERROR: Deployment failed."

            exit 1

          fi

          DEPLOYMENT_ID="$(
            jq -r '.deploymentId // empty' deployment_response.json
          )"

          DEPLOYMENT_PACKAGE_ID="$(
            jq -r '.packageId // empty' deployment_response.json
          )"

          DEPLOYMENT_ENVIRONMENT_ID="$(
            jq -r '.environmentId // empty' deployment_response.json
          )"

          DEPLOYMENT_ACTIVE="$(
            jq -r '.active // false' deployment_response.json
          )"

          if [[ -z "${DEPLOYMENT_ID}" ]]; then

            echo "ERROR: deploymentId was not returned."

            exit 1

          fi

          if [[ "${DEPLOYMENT_PACKAGE_ID}" != "${PACKAGE_ID}" ]]; then

            echo "ERROR: Returned package ID does not match."

            exit 1

          fi

          if [[ "${DEPLOYMENT_ENVIRONMENT_ID}" != "${BOOMI_ENVIRONMENT_ID}" ]]; then

            echo "ERROR: Returned environment ID does not match."

            exit 1

          fi

          if [[ "${DEPLOYMENT_ACTIVE}" != "true" ]]; then

            echo "ERROR: Deployment is not active."

            exit 1

          fi

          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "${GITHUB_ENV}"

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Deployment ID : ${DEPLOYMENT_ID}"
          echo "Active        : ${DEPLOYMENT_ACTIVE}"
          echo "=========================================="


      # ======================================================
      # STEP 6
      # ======================================================

      - name: Verify Active Deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STEP 5 - VERIFY ACTIVE DEPLOYMENT"
          echo "=========================================="

          AUTH_USER="BOOMI_TOKEN.${BOOMI_USERNAME}"

          HTTP_CODE="$(
            curl -sS \
              -o deployment_verify.json \
              -w "%{http_code}" \
              -u "${AUTH_USER}:${BOOMI_API_TOKEN}" \
              -H "Accept: application/json" \
              "${API_ROOT}/DeployedPackage/${DEPLOYMENT_ID}"
          )"

          echo "Verification HTTP Status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" != "200" ]]; then

            echo "ERROR: Unable to retrieve deployment."

            cat deployment_verify.json || true

            exit 1

          fi

          VERIFY_ACTIVE="$(
            jq -r '.active // false' deployment_verify.json
          )"

          VERIFY_PACKAGE_ID="$(
            jq -r '.packageId // empty' deployment_verify.json
          )"

          VERIFY_ENVIRONMENT_ID="$(
            jq -r '.environmentId // empty' deployment_verify.json
          )"

          VERIFY_COMPONENT_ID="$(
            jq -r '.componentId // empty' deployment_verify.json
          )"

          if [[ "${VERIFY_ACTIVE}" != "true" ]]; then

            echo "ERROR: Deployment is not active."

            exit 1

          fi

          if [[ "${VERIFY_PACKAGE_ID}" != "${PACKAGE_ID}" ]]; then

            echo "ERROR: Package verification failed."

            exit 1

          fi

          if [[ "${VERIFY_ENVIRONMENT_ID}" != "${BOOMI_ENVIRONMENT_ID}" ]]; then

            echo "ERROR: Environment verification failed."

            exit 1

          fi

          if [[ "${VERIFY_COMPONENT_ID}" != "${BOOMI_COMPONENT_ID}" ]]; then

            echo "ERROR: Component verification failed."

            exit 1

          fi

          echo ""
          echo "Active deployment verification passed."


      # ======================================================
      # STEP 7
      # ======================================================

      - name: Wait for Runtime Deployment Propagation
        shell: bash
        run: |
          echo "=========================================="
          echo "STEP 6 - WAIT FOR RUNTIME PROPAGATION"
          echo "=========================================="

          echo "Waiting 30 seconds..."

          sleep 30


      # ======================================================
      # STEP 8
      # ======================================================

      - name: Execute Deployed CICD Demo Process
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STEP 7 - EXECUTE CICD_Demo_Process"
          echo "=========================================="

          AUTH_USER="BOOMI_TOKEN.${BOOMI_USERNAME}"

          jq -n \
            --arg atomId "${BOOMI_ATOM_ID}" \
            --arg processId "${BOOMI_COMPONENT_ID}" \
            '{
              "@type": "ExecutionRequest",
              atomId: $atomId,
              processId: $processId,
              DynamicProcessProperties: {
                DynamicProcessProperty: []
              },
              ProcessProperties: {
                ProcessProperty: []
              }
            }' > execution_request.json

          EXECUTION_SUBMITTED="false"

          for ATTEMPT in $(seq 1 8); do

            echo ""
            echo "ExecutionRequest attempt ${ATTEMPT}/8"

            HTTP_CODE="$(
              curl -sS \
                -o execution_response.json \
                -w "%{http_code}" \
                -u "${AUTH_USER}:${BOOMI_API_TOKEN}" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -X POST \
                "${API_ROOT}/ExecutionRequest" \
                --data @execution_request.json
            )"

            echo "ExecutionRequest HTTP Status: ${HTTP_CODE}"

            if (( HTTP_CODE >= 200 && HTTP_CODE < 300 )); then

              EXECUTION_SUBMITTED="true"

              break

            fi

            if [[ "${HTTP_CODE}" == "401" || "${HTTP_CODE}" == "403" ]]; then

              echo "ERROR: Authentication/permission failure."

              cat execution_response.json || true

              exit 1

            fi

            echo "Deployment may still be reaching the runtime."

            cat execution_response.json || true

            echo "Waiting 15 seconds before retry..."

            sleep 15

          done

          if [[ "${EXECUTION_SUBMITTED}" != "true" ]]; then

            echo "ERROR: Unable to execute deployed process."

            exit 1

          fi

          echo ""
          echo "Execution response:"
          jq . execution_response.json

          REQUEST_ID="$(
            jq -r '.requestId // empty' execution_response.json
          )"

          if [[ -z "${REQUEST_ID}" ]]; then

            echo "ERROR: Boomi did not return requestId."

            exit 1

          fi

          echo "REQUEST_ID=${REQUEST_ID}" >> "${GITHUB_ENV}"

          echo ""
          echo "Execution submitted successfully."
          echo "Request ID: ${REQUEST_ID}"


      # ======================================================
      # STEP 9
      # ======================================================

      - name: Wait for Boomi Execution Result
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STEP 8 - WAIT FOR EXECUTION RESULT"
          echo "=========================================="

          AUTH_USER="BOOMI_TOKEN.${BOOMI_USERNAME}"

          EXECUTION_SUCCESS="false"

          FINAL_STATUS=""

          EXECUTION_ID=""

          RETURNED_PROCESS_NAME=""

          RETURNED_ATOM_NAME=""

          for ATTEMPT in $(seq 1 36); do

            echo ""
            echo "ExecutionRecord check ${ATTEMPT}/36"

            HTTP_CODE="$(
              curl -sS \
                -o execution_record_response.json \
                -w "%{http_code}" \
                -u "${AUTH_USER}:${BOOMI_API_TOKEN}" \
                -H "Accept: application/json" \
                "${API_ROOT}/ExecutionRecord/async/${REQUEST_ID}"
            )"

            echo "ExecutionRecord HTTP Status: ${HTTP_CODE}"

            if [[ "${HTTP_CODE}" == "202" ]]; then

              echo "Execution record not available yet."

              sleep 10

              continue

            fi

            if [[ "${HTTP_CODE}" != "200" ]]; then

              echo "ERROR: Unable to retrieve execution result."

              cat execution_record_response.json || true

              exit 1

            fi

            STATUS="$(
              jq -r '(.result[0] // .).status // empty' \
              execution_record_response.json
            )"

            EXECUTION_ID="$(
              jq -r '(.result[0] // .).executionId // empty' \
              execution_record_response.json
            )"

            RETURNED_PROCESS_NAME="$(
              jq -r '(.result[0] // .).processName // empty' \
              execution_record_response.json
            )"

            RETURNED_PROCESS_ID="$(
              jq -r '(.result[0] // .).processId // empty' \
              execution_record_response.json
            )"

            RETURNED_ATOM_NAME="$(
              jq -r '(.result[0] // .).atomName // empty' \
              execution_record_response.json
            )"

            RETURNED_ATOM_ID="$(
              jq -r '(.result[0] // .).atomId // empty' \
              execution_record_response.json
            )"

            MESSAGE="$(
              jq -r '(.result[0] // .).message // empty' \
              execution_record_response.json
            )"

            echo ""
            echo "=========================================="
            echo "EXECUTION RECORD"
            echo "=========================================="
            echo "Process Name : ${RETURNED_PROCESS_NAME}"
            echo "Runtime Name : ${RETURNED_ATOM_NAME}"
            echo "Execution ID : ${EXECUTION_ID}"
            echo "Status       : ${STATUS}"
            echo "=========================================="

            if [[ "${RETURNED_PROCESS_ID}" != "${BOOMI_COMPONENT_ID}" ]]; then

              echo "ERROR: Process ID mismatch."

              exit 1

            fi

            if [[ "${RETURNED_ATOM_ID}" != "${BOOMI_ATOM_ID}" ]]; then

              echo "ERROR: Runtime ID mismatch."

              exit 1

            fi

            if [[ "${RETURNED_PROCESS_NAME}" != "${EXPECTED_PROCESS_NAME}" ]]; then

              echo "ERROR: Process name mismatch."

              exit 1

            fi

            case "${STATUS}" in

              COMPLETE|COMPLETE_WARN)

                EXECUTION_SUCCESS="true"

                FINAL_STATUS="${STATUS}"

                break

                ;;

              ERROR|ABORTED|ABORTED_RECOVERING|DISCARDED)

                echo "ERROR: Boomi process execution failed."

                echo "Status : ${STATUS}"

                echo "Message: ${MESSAGE}"

                exit 1

                ;;

              *)

                echo "Current status: ${STATUS}"

                sleep 10

                ;;

            esac

          done

          if [[ "${EXECUTION_SUCCESS}" != "true" ]]; then

            echo "ERROR: Timed out waiting for process."

            exit 1

          fi

          echo "FINAL_STATUS=${FINAL_STATUS}" >> "${GITHUB_ENV}"

          echo "EXECUTION_ID=${EXECUTION_ID}" >> "${GITHUB_ENV}"

          echo "RETURNED_PROCESS_NAME=${RETURNED_PROCESS_NAME}" >> "${GITHUB_ENV}"

          echo "RETURNED_ATOM_NAME=${RETURNED_ATOM_NAME}" >> "${GITHUB_ENV}"


      # ======================================================
      # STEP 10
      # ======================================================

      - name: Final Deployment Summary
        shell: bash
        run: |

          echo "=========================================="
          echo "BOOMI SAVE CI/CD COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo "Process          : ${RETURNED_PROCESS_NAME}"
          echo "Runtime          : ${RETURNED_ATOM_NAME}"
          echo "Saved Revision   : ${CURRENT_REVISION}"
          echo "Package Revision : ${PACKAGED_COMPONENT_REVISION}"
          echo "Package Version  : ${PACKAGE_VERSION}"
          echo "Package ID       : ${PACKAGE_ID}"
          echo "Deployment ID    : ${DEPLOYMENT_ID}"
          echo "Execution ID     : ${EXECUTION_ID}"
          echo "Execution Status : ${FINAL_STATUS}"
          echo "=========================================="

          {
            echo "# Boomi Save CI/CD Successful"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| Process | ${RETURNED_PROCESS_NAME} |"
            echo "| Runtime | ${RETURNED_ATOM_NAME} |"
            echo "| Saved Revision | ${CURRENT_REVISION} |"
            echo "| Package Revision | ${PACKAGED_COMPONENT_REVISION} |"
            echo "| Package Version | ${PACKAGE_VERSION} |"
            echo "| Package ID | ${PACKAGE_ID} |"
            echo "| Deployment ID | ${DEPLOYMENT_ID} |"
            echo "| Execution ID | ${EXECUTION_ID} |"
            echo "| Execution Status | ${FINAL_STATUS} |"
          } >> "${GITHUB_STEP_SUMMARY}"
